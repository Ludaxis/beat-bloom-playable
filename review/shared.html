<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Beat Bloom · Play this level</title>
    <meta
      name="description"
      content="Match colors, clear rings and build the music. Try this Beat Bloom level."
    />
    <meta name="referrer" content="no-referrer" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #120c28;
        color: white;
        font:
          16px/1.6 Arial,
          sans-serif;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #status {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 32px;
        text-align: center;
      }
      [hidden] {
        display: none !important;
      }
    </style>
    <!-- Static metadata lets messaging apps preview links without running the game. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beat Bloom Studio" />
    <meta property="og:title" content="Beat Bloom · Play this level" />
    <meta
      property="og:description"
      content="Match colors, clear rings and build the music. Try this Beat Bloom level."
    />
    <meta
      property="og:image"
      content="https://beatbloomstudio.ludaxis.io/review/brand/beat-bloom-share-20260908.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Beat Bloom logo, neon heart and purple music mascot. Color. Clear. Create music."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Beat Bloom · Play this level" />
    <meta
      name="twitter:description"
      content="Match colors, clear rings and build the music. Try this Beat Bloom level."
    />
    <meta
      name="twitter:image"
      content="https://beatbloomstudio.ludaxis.io/review/brand/beat-bloom-share-20260908.jpg"
    />
    <meta name="twitter:image:alt" content="Beat Bloom logo, neon heart and purple music mascot." />
  </head>
  <body>
    <div id="status" role="status">Loading playable…</div>
    <iframe
      id="playable"
      title="Beat Bloom shared playable"
      allow="autoplay"
      sandbox="allow-scripts allow-same-origin"
      hidden
    ></iframe>
    <script type="module">
      import { decodeShare } from '/review/share-codec.js';
      addEventListener('hashchange', () => location.reload());
      try {
        const shortId = location.pathname.match(/^\/play\/([A-Za-z0-9_-]{22})$/)?.[1];
        async function loadSnapshot() {
          if (!shortId) return decodeShare(location.hash.slice(1));
          const response = await fetch('/api/share?id=' + shortId, {
            signal: AbortSignal.timeout(30000),
          });
          const saved = await response.json();
          if (!response.ok) throw Error(saved.error || 'Please try again.');
          if (
            saved?.version !== 1 ||
            !['native', 'a-heart', 'b-heart', 'a-flower', 'b-flower'].includes(saved.profile) ||
            !saved.level
          )
            throw Error('This playable has invalid settings.');
          return saved;
        }
        const saved = await loadSnapshot(),
          raw = JSON.stringify(saved),
          digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
        const hex = [...new Uint8Array(digest)]
          .map((n) => n.toString(16).padStart(2, '0'))
          .join('')
          .slice(0, 32);
        const id = [
          hex.slice(0, 8),
          hex.slice(8, 12),
          hex.slice(12, 16),
          hex.slice(16, 20),
          hex.slice(20),
        ].join('-');
        localStorage.setItem('beatbloom:studio-preview:' + id, raw);
        const frame = document.querySelector('#playable');
        frame.src = `/dist/preview/${saved.profile}.html?studioLevel=${id}&song=${encodeURIComponent(saved.level.songId)}`;
        frame.hidden = false;
        document.querySelector('#status').hidden = true;
      } catch (error) {
        document.querySelector('#status').textContent = 'Unable to open playable. ' + error.message;
      }
    </script>
  </body>
</html>
